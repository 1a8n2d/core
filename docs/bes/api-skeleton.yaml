openapi: 3.1.0
info:
  title: BES Universal Music Distribution API
  version: 0.1.0
  summary: Draft API surface for BES music distribution architecture.
paths:
  /api/knowledge/ingestions:
    post:
      summary: Ingest a raw document and trigger the knowledge pipeline.
      x-bes-module: Knowledge Engine
      responses:
        '202': { description: Ingestion accepted }
  /api/knowledge/records:
    get:
      summary: Search canonical BES knowledge records.
      x-bes-module: Knowledge Engine
      responses:
        '200': { description: Knowledge records }
  /api/releases:
    post:
      summary: Create a release draft.
      x-bes-module: Release Manager
      responses:
        '201': { description: Release created }
    get:
      summary: List releases.
      x-bes-module: Release Manager
      responses:
        '200': { description: Releases }
  /api/releases/{releaseId}/submit:
    post:
      summary: Submit a release into validation and approval workflow.
      x-bes-module: Release Manager
      responses:
        '202': { description: Release submission accepted }
  /api/metadata/normalize:
    post:
      summary: Normalize release metadata against BES and platform rules.
      x-bes-module: Metadata Engine
      responses:
        '200': { description: Normalized metadata }
  /api/rights/clearance:
    post:
      summary: Evaluate rights clearance and territory restrictions.
      x-bes-module: Rights Engine
      responses:
        '200': { description: Clearance result }
  /api/distribution/jobs:
    post:
      summary: Create a distribution job after required approvals.
      x-bes-module: Distribution Engine
      x-human-approval-required: true
      responses:
        '202': { description: Distribution job accepted }
  /api/platforms:
    post:
      summary: Register a platform profile.
      x-bes-module: Platform Registry
      responses:
        '201': { description: Platform registered }
    get:
      summary: List platform profiles and connector status.
      x-bes-module: Platform Registry
      responses:
        '200': { description: Platforms }
  /api/connectors/generate:
    post:
      summary: Generate a connector specification and code skeleton proposal.
      x-bes-module: Platform Connectors
      responses:
        '202': { description: Connector generation task accepted }
  /api/publishing/accounts:
    post:
      summary: Save or update a Telegram publication account after first binding.
      x-bes-module: Publishing UX
      responses:
        '201': { description: Publication account saved }
    get:
      summary: List saved publication accounts with favorites, recent accounts, and quick-search metadata.
      x-bes-module: Publishing UX
      responses:
        '200': { description: Saved publication accounts }
  /api/publishing/releases/{releaseId}/preview:
    post:
      summary: Generate the exact release image and post payload used for live preview and publication.
      x-bes-module: Publishing UX
      responses:
        '200': { description: Publication preview generated }
  /api/publishing/releases/{releaseId}/telegram:
    post:
      summary: Publish a release post to Telegram with normalized errors, audit logging, and temporary-failure retries.
      x-bes-module: Publishing Worker
      responses:
        '202': { description: Telegram publication accepted }
        '422': { description: Publication validation failed }
        '502':
          { description: Telegram publication failed with user-facing reason }
  /api/publishing/jobs/{jobId}/errors:
    get:
      summary: Return safe publication error log entries for a failed or retried publication job.
      x-bes-module: Publishing Worker
      responses:
        '200': { description: Publication error log }
  /api/publishing/settings/{settingsId}:
    patch:
      summary: Autosave an instant settings change and append an undo-history entry.
      x-bes-module: Publishing UX
      responses:
        '200': { description: Settings autosaved }
  /api/publishing/settings/{settingsId}/undo:
    post:
      summary: Undo the latest publishing settings change.
      x-bes-module: Publishing UX
      responses:
        '200': { description: Settings change undone }
  /api/publishing/settings/{settingsId}/redo:
    post:
      summary: Redo the latest undone publishing settings change.
      x-bes-module: Publishing UX
      responses:
        '200': { description: Settings change redone }
  /api/analytics/reports:
    get:
      summary: Query analytics reports for streams, revenue, audience, growth, and forecasts.
      x-bes-module: Analytics Engine
      responses:
        '200': { description: Analytics report }
  /api/royalties/statements:
    post:
      summary: Generate a draft royalty statement from revenue and split inputs.
      x-bes-module: Royalty Engine
      responses:
        '202': { description: Royalty statement generation accepted }
  /api/contracts/drafts:
    post:
      summary: Generate contract drafts, appendices, commercial offers, and human review checklists.
      x-bes-module: Contract Engine
      x-external-commitment-forbidden-without-approval: true
      responses:
        '202': { description: Contract drafting accepted }
  /api/finance/models:
    post:
      summary: Create or simulate subscription, commission, revenue-share, enterprise, white-label, marketplace, custom, or hybrid financial models.
      x-bes-module: Financial Engine
      responses:
        '201': { description: Financial model created }
  /api/partners:
    post:
      summary: Create a partner profile and onboarding workflow.
      x-bes-module: Partner Portal
      responses:
        '201': { description: Partner created }
components:
  schemas:
    KnowledgeRecord:
      type: object
      required:
        [id, sourceId, entityType, canonicalName, confidence, provenance]
      properties:
        id: { type: string }
        sourceId: { type: string }
        entityType: { type: string }
        canonicalName: { type: string }
        summary: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        provenance: { type: array, items: { type: string } }
    Release:
      type: object
      required: [id, artistId, title, status]
      properties:
        id: { type: string }
        artistId: { type: string }
        title: { type: string }
        version: { type: string }
        upc: { type: string }
        status: { type: string }
        releaseDate: { type: string, format: date }
    PlatformConnectorManifest:
      type: object
      required: [platformId, capabilities, authType, approvalPolicy]
      properties:
        platformId: { type: string }
        capabilities: { type: array, items: { type: string } }
        authType: { type: string }
        approvalPolicy:
          { type: string, enum: [internal_only, human_approval_required] }

    PublicationAccount:
      type: object
      required: [id, type, displayName, username, permissionStatus]
      properties:
        id: { type: string }
        type: { type: string, enum: [channel, group, bot] }
        displayName: { type: string }
        username: { type: string }
        avatarUrl: { type: string }
        favorite: { type: boolean }
        lastUsedAt: { type: string, format: date-time }
        permissionStatus:
          { type: string, enum: [unknown, valid, missing_rights, invalid] }
    PublicationJob:
      type: object
      required: [id, releaseId, accountId, status, attempts]
      properties:
        id: { type: string }
        releaseId: { type: string }
        accountId: { type: string }
        status:
          {
            type: string,
            enum: [queued, generating, sending, retrying, published, failed],
          }
        attempts: { type: integer, minimum: 0 }
        lastErrorCode: { type: string }
        lastErrorMessage: { type: string }
        nextRetryAt: { type: string, format: date-time }
    PublishingSettings:
      type: object
      required: [id, preset, toggles, layout, autosaveRevision]
      properties:
        id: { type: string }
        preset:
          {
            type: string,
            enum: [telegram, vk, discord, instagram, youtube, custom],
          }
        toggles:
          type: object
          additionalProperties: { type: boolean }
        layout:
          type: object
          properties:
            logoSize: { type: integer }
            avatarSize: { type: integer }
            coverSize: { type: integer }
            releaseImageSize: { type: integer }
            watermarkSize: { type: integer }
            padding: { type: integer }
            borderRadius: { type: integer }
            opacity: { type: number, minimum: 0, maximum: 1 }
        templateId: { type: string }
        autosaveRevision: { type: integer }
        previewSnapshotId: { type: string }
